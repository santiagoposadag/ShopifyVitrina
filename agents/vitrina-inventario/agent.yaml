# The owner's inventory assistant. `tools:` must equal exactly what
# buildToolServer serves the "owner" role today — pinned by set-equality in
# server/test/definition.test.ts, derived from buildToolServer itself, not
# copied out by hand.
id: vitrina-inventario
roles:
  - owner
model:
  # Matches the `maxTurns: 12` literal runtime.ts has hardcoded since before
  # this file existed. Not yet read by the runtime — see the Phase 2 report.
  maxTurns: 12
tools:
  - search_catalog
  - get_product
  - save_lead
  - build_cart
  - list_products
  - create_product
  - update_product
  - add_variant
  - delete_product
  - get_inventory
  - adjust_inventory
  - attach_pending_photos
  - list_locations
  - list_leads
prompt:
  base: grounding
  persona: prompt.md
  slots: {}
knowledge:
  inline: []
  searchable: []
  maxInlineTokens: 0
session:
  # Matches SESSION_MAX_AGE_DAYS's default in config.ts. Not yet read by the
  # runtime, which still applies config.sessionMaxAgeDays to every agent — see
  # the Phase 2 report.
  maxAgeDays: 7
  # create_product and update_product both set ctx.sessionAfterTurn = "reset"
  # on a publish transition (agent/tools.ts). Declared here as the seam Phase 3
  # wires the runtime to instead of a tool reaching into ctx directly; not yet
  # read.
  resetOn:
    - create_product
    - update_product
  keyedBy: principal
reach: []
