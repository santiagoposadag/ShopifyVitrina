# The owner's inventory assistant. `tools:` must equal exactly what
# buildToolServer serves the "owner" role today — pinned by set-equality in
# server/test/definition.test.ts, derived from buildToolServer itself, not
# copied out by hand.
id: vitrina-inventario
roles:
  - owner
model:
  # Read by runtime.ts as the SDK's own maxTurns option.
  maxTurns: 12
tools:
  - search_catalog
  - get_product
  - save_lead
  - build_cart
  - list_products
  - create_product
  - update_product
  - add_variant
  - delete_product
  - get_inventory
  - adjust_inventory
  - attach_pending_photos
  - list_locations
  - list_leads
prompt:
  base: grounding
  persona: prompt.md
  slots: {}
knowledge:
  inline: []
  searchable: []
  maxInlineTokens: 0
session:
  # Deliberately UNSET: SESSION_MAX_AGE_DAYS (config.ts) stays authoritative
  # for this agent. Setting this to today's default of 7 would make the YAML
  # outrank the environment variable — a deployment that has actually changed
  # SESSION_MAX_AGE_DAYS would have this agent's window silently overridden by
  # a data file nobody told it to read. Set this only when this agent's window
  # is meant to differ from the deployment's own default.
  #
  # create_product and update_product CAN trigger a reset, but only through the
  # publish TRANSITION each evaluates for itself (isPublishTransition in
  # agent/tools.ts) — a product becoming ACTIVE when it was not before, signalled
  # through ctx.sessionAfterTurn. This list is NOT "reset whenever one of these
  # tools is called": update_product changing a price resets nothing today, and
  # a Phase 3 reading that treats tool names here as the trigger itself would
  # reset the owner's session on an ordinary edit — the exact mid-listing data
  # loss the transition check exists to prevent. Not yet read by the runtime.
  resetOn:
    - create_product
    - update_product
  keyedBy: principal
reach: []
