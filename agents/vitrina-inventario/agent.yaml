# The owner's inventory assistant. `tools:` IS the tool set now: the registry
# (server/src/tools/registry.ts) serves exactly these keys and nothing else,
# and server/test/tools.test.ts pins the result against the owner list it used
# to be selected by. Every name here must exist in the registry or boot fails.
id: vitrina-inventario
roles:
  - owner
model:
  # Read by runtime.ts as the SDK's own maxTurns option.
  maxTurns: 12
tools:
  - search_catalog
  # The any-status reader, exposed to the model as `get_product` like the
  # customer's. Two registry entries, one name: this one sees drafts and
  # archived products, and the sales agent's must not — which is why the
  # difference is a tool a definition chooses and not a branch inside one.
  - get_product_any_status
  - save_lead
  - build_cart
  - list_products
  - create_product
  - update_product
  - add_variant
  - delete_product
  - get_inventory
  - adjust_inventory
  - attach_pending_photos
  - list_locations
  - list_leads
  # The knowledge base's own tool. Declared here and knowledge.searchable below
  # are checked against each other at boot, in BOTH directions: documents no
  # tool can read, and a tool with nothing to read, are each a silent hole.
  - search_knowledge
prompt:
  base: grounding
  persona: prompt.md
  slots: {}
knowledge:
  # Two tiers, and the split is not about size for its own sake.
  #
  # INLINE is in the system prompt on every turn, which is the only thing a
  # RESUMED transcript is guaranteed to carry: vocabulary the assistant must
  # never be without goes here, and it is paid for on every turn.
  #
  # SEARCHABLE is indexed (FTS5) and reached through search_knowledge, so the
  # grounding rule keeps holding — the assistant states what a tool returned —
  # and long procedures cost nothing on the turns that do not need them.
  #
  # Paths are relative to this directory and must stay under knowledge/. Every
  # .md file in there must be declared by one of the two lists: a document
  # nothing declares is one no turn can reach, and boot fails on it rather than
  # leaving the owner believing the assistant was told something.
  inline:
    - knowledge/glosario.md
  searchable:
    - knowledge/operaciones.md
  # A budget over the INLINE documents only, checked at boot against a
  # deliberate OVER-estimate (3 characters per token; real Spanish prose is
  # nearer 4). glosario.md measures about 1160 by that count, so this leaves
  # room for an edit without being so loose that the budget stops meaning
  # anything. Exceeding it FAILS BOOT and is never truncated — half a glossary
  # reads exactly like a whole one and nobody would ever see the cut.
  maxInlineTokens: 1400
session:
  # Deliberately UNSET: SESSION_MAX_AGE_DAYS (config.ts) stays authoritative
  # for this agent. Setting this to today's default of 7 would make the YAML
  # outrank the environment variable — a deployment that has actually changed
  # SESSION_MAX_AGE_DAYS would have this agent's window silently overridden by
  # a data file nobody told it to read. Set this only when this agent's window
  # is meant to differ from the deployment's own default.
  #
  # create_product and update_product CAN trigger a reset, but only through the
  # publish TRANSITION each evaluates for itself (isPublishTransition in
  # tools/packs/catalog.ts) — a product becoming ACTIVE when it was not before,
  # signalled through ctx.sessionAfterTurn. This list is NOT "reset whenever one
  # of these tools is called": update_product changing a price resets nothing
  # today, and a reading that treats tool names here as the trigger itself would
  # reset the owner's session on an ordinary edit — the exact mid-listing data
  # loss the transition check exists to prevent. Not yet read by the runtime.
  resetOn:
    - create_product
    - update_product
  keyedBy: principal
reach: []
