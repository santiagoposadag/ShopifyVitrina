# The customer-facing sales assistant. `tools:` must equal exactly what
# buildToolServer serves the "customer" role today — pinned by set-equality in
# server/test/definition.test.ts, derived from buildToolServer itself, not
# copied out by hand.
id: vitrina-ventas
roles:
  - customer
model:
  # Read by runtime.ts as the SDK's own maxTurns option.
  maxTurns: 12
tools:
  - search_catalog
  - get_product
  - save_lead
  - build_cart
prompt:
  base: grounding
  persona: prompt.md
  slots: {}
knowledge:
  inline: []
  searchable: []
  maxInlineTokens: 0
session:
  # Deliberately UNSET: SESSION_MAX_AGE_DAYS (config.ts) stays authoritative
  # for this agent — see the matching comment in vitrina-inventario/agent.yaml
  # for why hard-coding today's default here would be a behaviour change.
  # The customer path has no publish transition — nothing resets its session.
  resetOn: []
  keyedBy: principal
reach: []
