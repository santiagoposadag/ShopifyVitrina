# The customer-facing sales assistant. `tools:` IS the tool set now: the
# registry (server/src/tools/registry.ts) serves exactly these keys and nothing
# else. This list is the privilege boundary — `get_product` here is the
# ACTIVE-only reader, and nothing that writes to the store appears at all;
# server/test/tools.test.ts pins both.
id: vitrina-ventas
# WHO reaches this agent. router.ts builds the phone -> role -> agent decision
# out of these lists plus the assignments table, and "customer" is every phone
# that has no owner assignment — which is the default for anyone who writes in.
roles:
  - customer
model:
  # Read by runtime.ts as the SDK's own maxTurns option.
  maxTurns: 12
tools:
  - search_catalog
  - get_product
  - save_lead
  - build_cart
prompt:
  base: grounding
  persona: prompt.md
  slots: {}
knowledge:
  # DELIBERATELY EMPTY, and not an oversight.
  #
  # The customer-facing documents this agent would want are returns, shipping,
  # payment and opening hours — exactly the facts nobody has supplied yet. A
  # sales agent with a knowledge base full of "PENDIENTE" would quote a
  # placeholder to a customer, and a confidently invented return policy is
  # worse than no knowledge base at all: the customer acts on it.
  #
  # Its prompt is therefore byte-for-byte what it was before the knowledge base
  # existed (composePrompt adds nothing for an agent with no documents), and its
  # behaviour is unchanged by this phase.
  #
  # When the owner supplies real policy, adding it is: a file under
  # knowledge/, one line in inline: or searchable:, a budget here, and — for
  # the searchable tier only — search_knowledge in tools[] above.
  inline: []
  searchable: []
  maxInlineTokens: 0
session:
  # Deliberately UNSET: SESSION_MAX_AGE_DAYS (config.ts) stays authoritative
  # for this agent — see the matching comment in vitrina-inventario/agent.yaml
  # for why hard-coding today's default here would be a behaviour change.
  # The customer path has no publish transition — nothing resets its session.
  resetOn: []
  keyedBy: principal
reach: []
