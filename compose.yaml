# Shared environment blocks (YAML anchors) so the services that need the same
# variables cannot drift apart.
#
# Secrets and per-deploy config arrive via ${VAR} interpolation, which Compose
# resolves from the parent shell env OR a repo-root .env file.
# Preferred flow: ./scripts/with-secrets.sh docker compose up -d
# (exports the secrets from gopass); a plain .env still works as fallback.
x-secrets-env: &secrets-env
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  KAPSO_API_KEY: ${KAPSO_API_KEY}
  KAPSO_PHONE_NUMBER_ID: ${KAPSO_PHONE_NUMBER_ID}
  KAPSO_WEBHOOK_SECRET: ${KAPSO_WEBHOOK_SECRET}
  OWNER_PHONE_NUMBERS: ${OWNER_PHONE_NUMBERS:-}

# Absolute paths inside the containers. server/src/config.ts short-circuits on
# isAbsolute(), so these override anything set in .env.
x-data-env: &data-env
  DB_PATH: /data/vitrina.db
  MEDIA_DIR: /data/media

services:
  server:
    image: vitrina-server
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      <<: [*secrets-env, *data-env]
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3001}
      PORT: "3001"
      # Cost/abuse protection and session lifetime. Empty values fall back to
      # the defaults in server/src/config.ts (20/hour, 500/day, 7 days).
      RATE_LIMIT_PER_PHONE_PER_HOUR: ${RATE_LIMIT_PER_PHONE_PER_HOUR:-}
      RATE_LIMIT_GLOBAL_PER_DAY: ${RATE_LIMIT_GLOBAL_PER_DAY:-}
      SESSION_MAX_AGE_DAYS: ${SESSION_MAX_AGE_DAYS:-}
    ports:
      - "3001:3001"
    volumes:
      - vitrina-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  web:
    image: vitrina-web
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # NEXT_PUBLIC_* vars are inlined at build time by Next.js — they must
        # be build args, not just runtime `environment:` below.
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-Vitrina}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
    environment:
      <<: *data-env
    ports:
      # Host port is configurable so the storefront can coexist with other
      # local apps that claim 3000 (set WEB_PORT in the shell or compose .env).
      - "${WEB_PORT:-3000}:3000"
    volumes:
      # Read-write, NOT read-only: SQLite in WAL mode writes -shm and -wal
      # sidecar files next to the DB even for read-only queries, so a
      # read-only mount here would break every read the storefront does.
      - vitrina-data:/data
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  # Seeds the two example properties. Excluded from `docker compose up` via
  # the "seed" profile — run it explicitly with:
  #   docker compose --profile seed run --rm seed
  # Shares the server image (same `image:` tag) so it is built only once.
  # Needs no secrets (seed.ts never reads them), but DOES need PUBLIC_BASE_URL:
  # it is baked into the seeded photo URLs that WhatsApp later fetches.
  seed:
    image: vitrina-server
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      <<: *data-env
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3001}
    command: ["node", "server/dist/seed.js"]
    volumes:
      - vitrina-data:/data
    profiles: ["seed"]

  # One-off consistent SQLite snapshot (online backup API, safe under writes).
  #   docker compose --profile backup run --rm backup   # snapshot inside the volume
  #   ./scripts/backup.sh                               # snapshot copied to ./backups on the host
  backup:
    image: vitrina-server
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      <<: *data-env
      BACKUP_DIR: ${BACKUP_DIR:-/data/backups}
      BACKUP_KEEP: ${BACKUP_KEEP:-}
    command: ["node", "server/dist/backup.js"]
    volumes:
      - vitrina-data:/data
    profiles: ["backup"]

volumes:
  # A named volume (not a host bind mount): the image already creates /data
  # owned by the non-root `node` user (see the Dockerfiles). A named volume
  # inherits that ownership on first use; a host bind mount would land
  # root-owned on most hosts and the non-root process could not write to it.
  vitrina-data: {}
